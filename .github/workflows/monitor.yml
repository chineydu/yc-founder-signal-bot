name: YC Founder Signal Monitor

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:
    inputs:
      test_slack:
        description: "Send a controlled demo alert to Slack instead of running monitoring"
        required: false
        default: false
        type: boolean

jobs:
  monitor:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Restore monitoring state
        if: ${{ inputs.test_slack != true }}
        uses: actions/cache/restore@v4
        with:
          path: state.db
          key: yc-state-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            yc-state-${{ runner.os }}-

      - name: Send controlled Slack demo alert
        if: ${{ inputs.test_slack == true }}
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          SLACK_CHANNEL_ID: ${{ secrets.SLACK_CHANNEL_ID }}
        run: |
          python - <<'PY'
          import app
          item = {
              "text": "*YC FOUNDER SIGNAL BOT — LIVE DEMO*\n\n"
                      "Company: Demo Labs\n"
                      "Founder: Jane Demo (@demo_founder)\n"
                      "Batch: YC S26\n"
                      "Source: X\n"
                      "Status: ⚡ Founder announcement detected before YC confirmation\n\n"
                      "Original post: https://x.com/example/status/123456\n"
                      "Company: https://example.com\n"
                      "Detected: controlled Slack delivery test"
          }
          if not app.slack_alert(item):
              raise SystemExit("Slack delivery test failed")
          print("Slack delivery test succeeded")
          PY

      - name: Run YC Founder Signal Monitor
        if: ${{ inputs.test_slack != true }}
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          SLACK_CHANNEL_ID: ${{ secrets.SLACK_CHANNEL_ID }}
          POND_WEBHOOK_URL: ${{ secrets.POND_WEBHOOK_URL }}
          X_BEARER_TOKEN: ${{ secrets.X_BEARER_TOKEN }}
          SOCIAL_SEARCH_ENABLED: "true"
          PUBLIC_X_SEARCH_ENABLED: "true"
          POLL_HOURS: "6"
          DB_PATH: "state.db"
        run: python -c "import app; app.run_once()"

      - name: Run dedicated LinkedIn indexed discovery
        if: ${{ inputs.test_slack != true && env.SOCIAL_SEARCH_ENABLED != 'false' }}
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          SLACK_CHANNEL_ID: ${{ secrets.SLACK_CHANNEL_ID }}
          SOCIAL_SEARCH_ENABLED: "true"
          DB_PATH: "state.db"
        run: |
          python - <<'PY'
          import app
          from linkedin_monitor import run_linkedin_monitor
          count = run_linkedin_monitor(app.yc_company_names(), emit_callback=app.emit)
          print(f"Dedicated LinkedIn indexed discovery completed: {count} candidate(s)")
          PY

      - name: Save monitoring state
        if: ${{ inputs.test_slack != true }}
        uses: actions/cache/save@v4
        with:
          path: state.db
          key: yc-state-${{ runner.os }}-${{ github.run_id }}
