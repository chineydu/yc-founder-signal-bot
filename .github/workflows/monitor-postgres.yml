name: YC Founder Signal Monitor (Postgres)

on:
  schedule:
    - cron: "0 */8 * * *"
  workflow_dispatch:

jobs:
  monitor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - name: Run monitoring cycle
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          SLACK_CHANNEL_ID: ${{ secrets.SLACK_CHANNEL_ID }}
          POND_WEBHOOK_URL: ${{ secrets.POND_WEBHOOK_URL }}
          X_BEARER_TOKEN: ${{ secrets.X_BEARER_TOKEN }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          SOCIAL_SEARCH_ENABLED: "true"
          POLL_HOURS: "8"
        run: python -c "import app; failures=app.run_once(); raise SystemExit('Source failures: ' + ', '.join(failures)) if failures else None"
