services:
  - type: web
    name: yc-founder-signal-bot
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python server.py
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: POLL_HOURS
        value: "8"
      - key: SOCIAL_SEARCH_ENABLED
        value: "true"
      - key: DATABASE_URL
        fromDatabase:
          name: yc-founder-signal-db
          property: connectionString
      - key: SLACK_BOT_TOKEN
        sync: false
      - key: SLACK_CHANNEL_ID
        sync: false
      - key: X_BEARER_TOKEN
        sync: false
      - key: POND_ACCESS_KEY
        sync: false
      - key: POND_WEBHOOK_URL
        sync: false

  - type: cron
    name: yc-founder-signal-monitor
    runtime: python
    plan: starter
    schedule: "0 */8 * * *"
    buildCommand: pip install -r requirements.txt
    startCommand: python worker.py
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: POLL_HOURS
        value: "8"
      - key: SOCIAL_SEARCH_ENABLED
        value: "true"
      - key: DATABASE_URL
        fromDatabase:
          name: yc-founder-signal-db
          property: connectionString
      - key: SLACK_BOT_TOKEN
        sync: false
      - key: SLACK_CHANNEL_ID
        sync: false
      - key: X_BEARER_TOKEN
        sync: false
      - key: POND_ACCESS_KEY
        sync: false
      - key: POND_WEBHOOK_URL
        sync: false

databases:
  - name: yc-founder-signal-db
    plan: free
    region: oregon
    postgresMajorVersion: 18
